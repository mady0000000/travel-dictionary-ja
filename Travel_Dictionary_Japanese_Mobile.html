<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>旅行辞書 — Travel Dictionary</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--navy:#0A2558;--gold:#D4AC0D;--en:#1a3a6b;--fr:#8b3000;--es:#1a5c2e}
body{font-family:"Noto Sans JP","Noto Sans",sans-serif;background:#f0f2f5;max-width:480px;margin:0 auto;min-height:100vh}

.header{background:var(--navy);padding:12px 14px 10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.header-title{color:var(--gold);font-size:17px;font-weight:700}
.header-sub{color:rgba(255,255,255,.5);font-size:10px}
.search-box{width:100%;background:rgba(255,255,255,.12);border:none;border-radius:20px;padding:8px 14px;color:#fff;font-size:13px;font-family:inherit;outline:none}
.search-box::placeholder{color:rgba(255,255,255,.4)}
.search-box:focus{background:rgba(255,255,255,.2)}

.loc-bar{background:#fff;border-bottom:1px solid #e5e7eb;padding:8px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.loc-bar::-webkit-scrollbar{display:none}
.loc-chip{flex-shrink:0;padding:5px 11px;border-radius:20px;border:1px solid #e5e7eb;font-size:11px;color:#666;cursor:pointer;white-space:nowrap;background:#fff;opacity:.6}
.loc-chip.on{color:#fff;border-color:transparent;opacity:1}

.content{padding:10px}

.sec-hdr{display:flex;align-items:center;gap:8px;padding:8px 4px 6px}
.sec-hdr-ja{font-size:14px;font-weight:700;color:#1a1a1a}
.sec-hdr-en{font-size:10px;color:#888}
.sec-hdr-cnt{font-size:10px;color:#aaa;margin-left:auto}

.pair{background:#fff;border-radius:12px;border:1px solid #e5e7eb;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}

.phrase-sec{padding:10px 12px 8px}
.phrase-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.pair-num{width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.phrase-label{font-size:9px;color:#aaa;margin-left:auto}
.ja-phrase{font-size:17px;font-weight:700;color:#1a1a1a;text-align:center;line-height:1.6;margin-bottom:8px;padding:0 4px}
.ja-reply-text{font-size:15px;font-weight:700;color:#0a3d62;text-align:center;line-height:1.6;margin-bottom:8px;padding:0 4px}

.langs-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-bottom:2px}
.lc{border-radius:8px;padding:7px 7px 6px;position:relative;min-height:52px}
.lc.en{background:#f0f5ff}
.lc.fr{background:#fff5f0}
.lc.es{background:#f0fff5}
.lc-top{display:flex;align-items:center;gap:4px;margin-bottom:4px}
.flag{width:18px;height:12px;border-radius:2px;overflow:hidden;display:inline-flex;flex-shrink:0}
.flag svg{width:100%;height:100%}
.lcode{font-size:9px;font-weight:700}
.lcode.en{color:var(--en)}
.lcode.fr{color:var(--fr)}
.lcode.es{color:var(--es)}
.ltext{font-size:10.5px;color:#1a1a1a;line-height:1.4;padding-bottom:16px}
.spk-btn{background:none;border:none;cursor:pointer;padding:2px 4px;color:#bbb;display:flex;align-items:center;position:absolute;bottom:5px;right:5px;border-radius:4px}
.spk-btn:hover{color:var(--navy);background:rgba(10,37,88,.08)}
.spk-btn.playing{color:var(--gold)}

.div-row{display:flex;align-items:center;gap:8px;padding:5px 12px}
.div-line{flex:1;height:1px;background:#e5e7eb}
.div-label{font-size:10px;color:#aaa}

.reply-sec{background:#f7f9ff;border-top:1px solid #e5e7eb;padding:10px 12px 8px}
.reply-langs .lc.en{background:#f0f9f0}
.reply-langs .lc.fr{background:#f5f0ff}
.reply-langs .lc.es{background:#fff8f0}

.bnav-spacer{height:60px}
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #e5e7eb;display:flex;z-index:100;padding:6px 0 8px}
.bni{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border:none;background:none}
.bni span{font-size:9px;color:#bbb}
.bni svg{color:#bbb}
.bni.on svg,.bni.on span{color:var(--navy)}
.empty{text-align:center;padding:40px;color:#aaa;font-size:13px}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <div class="header-title">旅行辞書</div>
      <div class="header-sub">Travel Dictionary · EN · FR · ES</div>
    </div>
    <div style="text-align:right">
      <div style="color:var(--gold);font-size:13px;font-weight:600">357</div>
      <div style="color:rgba(255,255,255,.5);font-size:10px">フレーズ</div>
    </div>
  </div>
  <input class="search-box" id="si" type="text" placeholder="フレーズを検索..."/>
</div>

<div class="loc-bar" id="locBar">

<div class="content" id="main"></div>
<div class="bnav-spacer"></div>

<div class="bnav">

    <span>フレーズ</span>
  </button>
  <button class="bni" onclick="setView(this,'search')">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <span>検索</span>
  </button>
  <button class="bni" onclick="setView(this,'locs')">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
    <span>場所</span>
  </button>
</div>

var curAudio=null,curBtn=null;
var activeLoc='',searchQ='';

function play(url,btn){
  if(!url)return;
  if(curAudio){curAudio.pause();if(curBtn)curBtn.classList.remove('playing');if(curBtn===btn){curAudio=null;curBtn=null;return;}}
  var a=new Audio(url);curAudio=a;curBtn=btn;
  btn.classList.add('playing');
  a.onended=function(){btn.classList.remove('playing');curAudio=null;curBtn=null;};
  a.onerror=function(){btn.classList.remove('playing');curAudio=null;curBtn=null;};
  a.play();
}

var SPK= + SPK + ;

function flagSVG(code){
  if(code==='EN') return '<svg viewBox="0 0 60 40"><rect width="60" height="40" fill="#B22234"/><rect y="6" width="60" height="5" fill="#fff"/><rect y="17" width="60" height="5" fill="#fff"/><rect y="28" width="60" height="5" fill="#fff"/><rect width="24" height="22" fill="#3C3B6E"/></svg>';
  if(code==='FR') return '<svg viewBox="0 0 60 40"><rect width="20" height="40" fill="#002395"/><rect x="20" width="20" height="40" fill="#fff"/><rect x="40" width="20" height="40" fill="#ED2939"/></svg>';
  if(code==='ES') return '<svg viewBox="0 0 60 40"><rect width="60" height="40" fill="#c60b1e"/><rect y="13" width="60" height="14" fill="#ffc400"/></svg>';
  return '';
}

function langCard(code,text,url,isReply){
  var lc=code.toLowerCase();
  var spk=url?'<button class="spk-btn" onclick="play(''+url+'',this)">'+SPK+'</button>':'';
  return '<div class="lc '+lc+'">'+
    '<div class="lc-top"><span class="flag">'+flagSVG(code)+'</span><span class="lcode '+lc+'">'+code+'</span></div>'+
    '<div class="ltext">'+text+'</div>'+spk+'</div>';
}

function pairHTML(p){
  var html='<div class="pair">';
  html+='<div class="phrase-sec">';
  html+='<div class="phrase-top"><div class="pair-num">'+p.num+'</div><div class="phrase-label">フレーズ</div></div>';
  html+='<div class="ja-phrase">'+p.phrase.ja+'</div>';
  html+='<div class="langs-row">';
  html+=langCard('EN',p.phrase.en,p.phrase.en_url,false);
  html+=langCard('FR',p.phrase.fr,p.phrase.fr_url,false);
  html+=langCard('ES',p.phrase.es,p.phrase.es_url,false);
  html+='</div></div>';
  if(p.reply && p.reply.ja){
    html+='<div class="div-row"><div class="div-line"></div><span class="div-label">返答</span><div class="div-line"></div></div>';
    html+='<div class="reply-sec">';
    html+='<div class="ja-reply-text">'+p.reply.ja+'</div>';
    html+='<div class="langs-row reply-langs">';
    html+=langCard('EN',p.reply.en,p.reply.en_url,true);
    html+=langCard('FR',p.reply.fr,p.reply.fr_url,true);
    html+=langCard('ES',p.reply.es,p.reply.es_url,true);
    html+='</div></div>';
  }
  html+='</div>';
  return html;
}

LOCS.forEach(function(loc){
  var d=document.createElement('div');
  d.className='loc-chip';d.dataset.loc=loc;
  d.style.background=COLORS[loc]||'#333';
  d.innerHTML=(ICONS[loc]||'')+' '+(JA[loc]||loc);
  d.onclick=function(){setLoc(d,loc);};
  document.getElementById('locBar').appendChild(d);
});

function setLoc(el,loc){
  activeLoc=loc;
  document.querySelectorAll('.loc-chip').forEach(function(c){c.classList.remove('on');});
  el.classList.add('on');
  render();
}

document.getElementById('si').oninput=function(e){searchQ=e.target.value;render();};

function setView(el,v){
  document.querySelectorAll('.bni').forEach(function(b){b.classList.remove('on');});
  el.classList.add('on');
  if(v==='search')document.getElementById('si').focus();
}

function render(){
  var q=searchQ.toLowerCase();
  var filtered=PAIRS.filter(function(p){
    if(activeLoc&&p.loc!==activeLoc)return false;
    if(q){
      var ok=p.phrase.ja.includes(searchQ)||p.phrase.en.toLowerCase().includes(q)||
             p.phrase.fr.toLowerCase().includes(q)||p.phrase.es.toLowerCase().includes(q)||
             (p.reply&&(p.reply.ja.includes(searchQ)||p.reply.en.toLowerCase().includes(q)));
      if(!ok)return false;
    }
    return true;
  });
  var html='';var lastLoc='';
  filtered.forEach(function(p){
    if(p.loc!==lastLoc){
      html+='<div class="sec-hdr">';
      html+='<span style="font-size:16px">'+(ICONS[p.loc]||'')+'</span>';
      html+='<div><div class="sec-hdr-ja">'+(JA[p.loc]||p.loc)+'</div>';
      html+='<div class="sec-hdr-en">'+p.loc+'</div></div>';
      html+='<div class="sec-hdr-cnt">'+filtered.filter(function(x){return x.loc===p.loc;}).length+' フレーズ</div>';
      html+='</div>';
      lastLoc=p.loc;
    }
    html+=pairHTML(p);
  });
  document.getElementById('main').innerHTML=html||'<div class="empty">見つかりませんでした</div>';
}
render();
</script>
